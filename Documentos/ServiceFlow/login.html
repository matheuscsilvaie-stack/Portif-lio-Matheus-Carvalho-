<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Acesso privado | MatheusFlow</title>
  <style>
    :root{font-family:'DM Sans',Arial,sans-serif;color:#172b4d;background:#f5f7fb;font-synthesis:none;text-rendering:optimizeLegibility;--blue:#3867e8;--navy:#142747;--muted:#77849a;--line:#e8edf4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(100%,420px);background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:0 14px 50px #1b345012}.brand{display:flex;align-items:center;gap:11px;color:var(--navy);font-size:20px;font-weight:800;margin-bottom:30px}.brand-icon{display:grid;place-items:center;width:38px;height:38px;background:var(--blue);border-radius:11px;color:#fff}.brand-light{color:var(--blue)}.eyebrow{color:var(--blue);font-size:10px;letter-spacing:1.3px;font-weight:700;margin:0 0 8px}.login-card h1{font-size:25px;margin:0 0 8px}.description{font-size:13px;line-height:1.6;color:var(--muted);margin:0 0 24px}label{display:block;font-size:12px;font-weight:700;color:#485a74;margin:15px 0 7px}input{width:100%;padding:12px;border:1px solid #dce3ed;border-radius:7px;font:14px Arial,sans-serif}input:focus{outline:2px solid #3867e833;border-color:#6e91f5}button{margin-top:22px;width:100%;border:0;border-radius:8px;padding:12px 16px;background:var(--blue);color:#fff;font-size:14px;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.feedback{min-height:20px;margin:13px 0 0;font-size:12px;color:#ba3c3c}.privacy{margin-top:18px;padding-top:15px;border-top:1px solid var(--line);color:#8b97a8;font-size:11px;line-height:1.5}
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand"><span class="brand-icon">M</span><span>Matheus<span class="brand-light">Flow</span></span></div>
    <p class="eyebrow">PAINEL PRIVADO</p>
    <h1>Entre na sua conta</h1>
    <p class="description">Acesse os chamados e os dados dos clientes com suas credenciais.</p>
    <form id="loginForm">
      <label for="username">Usuário</label>
      <input id="username" name="username" type="text" autocomplete="username" required maxlength="100">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="loginButton" type="submit">Entrar</button>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    </form>
    <p class="privacy">Acesso restrito ao responsável pelo painel. Não use este formulário para compartilhar dados de clientes.</p>
  </main>
  <script>
    (() => {
      const form = document.querySelector('#loginForm');
      const button = document.querySelector('#loginButton');
      const feedback = document.querySelector('#feedback');
      fetch('/api/session', { credentials: 'same-origin' }).then(response => {
        if (response.ok) window.location.replace('/');
      }).catch(() => {});
      form.addEventListener('submit', async event => {
        event.preventDefault();
        button.disabled = true;
        feedback.textContent = '';
        const data = new FormData(form);
        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ username: data.get('username'), password: data.get('password') })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || 'Não foi possível entrar.');
          window.location.replace('/');
        } catch (error) {
          feedback.textContent = error.message;
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
