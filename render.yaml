services:
  - type: web
    name: matheusflow-matheuscsilvaie
    runtime: python
    plan: free
    region: ohio
    rootDir: Documentos/ServiceFlow
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: "true"
